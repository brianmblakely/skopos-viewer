name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt
      - run: playwright install --with-deps chromium webkit
      # WebKit is the only engine iOS can run; chromium covers everything else.
      - run: pytest tests/ --browser chromium --browser webkit
